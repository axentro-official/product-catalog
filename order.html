<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>إتمام الطلب</title>

  <style>
    :root{
      --bg:#ffffff;
      --panel:#ffffff;
      --panel2:#fbfbfd;

      --text:#0f172a;
      --muted:#64748b;

      --stroke:#e6e8ee;
      --stroke2:#f1f5f9;

      --shadow: 0 18px 50px rgba(15,23,42,.10);
      --radius:18px;

      --gold1:#D4AF37;
      --gold2:#B8860B;
      --goldSoft: rgba(212,175,55,.18);
      --goldSoft2: rgba(184,134,11,.12);

      --ok:#16a34a;
      --warn:#d97706;
      --bad:#dc2626;

      --container-max:980px;

      --safe-b: env(safe-area-inset-bottom, 0px);
      --bar-h: 74px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial;
      color:var(--text);
      background:
        radial-gradient(900px 480px at 10% 10%, var(--goldSoft), transparent 60%),
        radial-gradient(760px 520px at 90% 20%, rgba(15,23,42,.05), transparent 60%),
        linear-gradient(180deg, var(--bg), #f7f8fb);
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
      display:flex;
      flex-direction:column;
    }

    a{color:inherit;text-decoration:none}
    .wrap{max-width:var(--container-max);margin:0 auto; width:100%}

    .topbar{
      position:sticky; top:0; z-index:30;
      display:flex; gap:12px; align-items:center; justify-content:space-between;
      padding:14px 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.70));
      border-bottom:1px solid var(--stroke);
      backdrop-filter: blur(10px);
    }

    .brand{display:flex; align-items:center; gap:12px}

    .logo{
      width:44px; height:44px; border-radius:999px; display:grid; place-items:center;
      background: linear-gradient(135deg, rgba(212,175,55,.18), rgba(184,134,11,.12));
      border:1px solid rgba(212,175,55,.35);
      box-shadow: 0 10px 26px rgba(15,23,42,.10);
      overflow:hidden; padding:6px;
      flex:0 0 auto;
    }

    .logo img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .brand-title{
      font-size:16px;
      font-weight:1000;
      letter-spacing:.2px;
    }

    .brand-sub{
      font-size:12px;
      color:var(--muted);
    }

    .actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .back{
      padding:11px 16px;
      border-radius:16px;
      border:1px solid rgba(212,175,55,.55);
      background: linear-gradient(135deg, rgba(212,175,55,.22), rgba(184,134,11,.18));
      color:#0f172a;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      font-weight:1000;
      box-shadow: 0 12px 22px rgba(212,175,55,.14);
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
      white-space:nowrap;
      min-height:46px;
    }

    .back:hover{
      border-color: rgba(212,175,55,.75);
      box-shadow: 0 16px 30px rgba(212,175,55,.18);
    }

    .back:active{
      transform: translateY(1px);
    }

    .backIcon{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:24px;
      height:24px;
      border-radius:999px;
      background: rgba(255,255,255,.70);
      border:1px solid rgba(212,175,55,.40);
      font-size:13px;
      flex:0 0 auto;
    }

    main{ padding:18px; }

    @media (max-width:720px){
      main{ padding:12px; }
      .topbar{
        flex-direction:column;
        align-items:stretch;
        gap:10px;
      }
      .actions{ justify-content:stretch; }
      .back{ width:100%; }
    }

    .card{
      margin-top:14px;
      padding:14px;
      border:1px solid var(--stroke);
      border-radius:var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,255,255,.90));
      box-shadow: var(--shadow);
    }

    .invBar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      margin-top:10px;
      padding:10px;
      border:1px solid var(--stroke);
      border-radius:16px;
      background: rgba(248,250,252,.90);
      box-shadow: 0 8px 18px rgba(15,23,42,.06);
    }

    .invBar .k{
      color:var(--muted);
      font-weight:900;
      font-size:12px;
    }

    .invBar .v{
      font-weight:1000;
    }

    .copyBtn{
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(212,175,55,.55);
      background: linear-gradient(135deg, rgba(212,175,55,.22), rgba(184,134,11,.18));
      color:#0f172a;
      font-weight:1000;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      user-select:none;
      white-space:nowrap;
      box-shadow: 0 12px 22px rgba(212,175,55,.14);
    }

    .copyBtn:active{transform: translateY(1px)}

    .note{
      margin-top:12px;
      padding:12px;
      border-radius:16px;
      border:1px solid rgba(212,175,55,.35);
      background: rgba(212,175,55,.10);
      color:#0f172a;
      font-weight:900;
      line-height:1.7;
    }

    .seg{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      padding:10px;
      border-radius:14px;
      border:1px solid var(--stroke);
      background: rgba(248,250,252,.90);
      margin-top:10px;
      box-shadow: 0 8px 18px rgba(15,23,42,.05);
    }

    .seg label{
      display:flex;
      align-items:center;
      gap:10px;
      margin:0;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.95);
      cursor:pointer;
      font-weight:1000;
      user-select:none;
    }

    .seg input{width:auto; margin:0}

    label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin:10px 0 6px;
      font-weight:900;
    }

    input, select, textarea{
      width:100%;
      padding:12px;
      border-radius:14px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.95);
      color:var(--text);
      outline:none;
      font-size:14px;
      box-shadow: 0 8px 18px rgba(15,23,42,.06);
    }

    input:focus, select:focus, textarea:focus{
      border-color: rgba(212,175,55,.65);
      box-shadow: 0 10px 22px rgba(212,175,55,.14);
    }

    @media (max-width:720px){
      input, textarea, select{ font-size:16px; }
    }

    .fieldError{
      margin-top:6px;
      font-size:12px;
      color:#991b1b;
      font-weight:1000;
      display:none;
    }

    .invalid{
      border-color: rgba(220,38,38,.70) !important;
      box-shadow: 0 0 0 3px rgba(220,38,38,.14) !important;
    }

    @keyframes shakeX{
      0%{transform:translateX(0)}
      20%{transform:translateX(-6px)}
      40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)}
      80%{transform:translateX(4px)}
      100%{transform:translateX(0)}
    }

    .shake{ animation: shakeX .28s ease; }

    .row2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    @media(max-width:720px){
      .row2{grid-template-columns:1fr}
    }

    .items{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:10px;
    }

    .item{
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.92);
      border-radius:16px;
      padding:10px;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      box-shadow: 0 10px 22px rgba(15,23,42,.08);
    }

    .thumb{
      width:56px;
      height:56px;
      border-radius:14px;
      border:1px solid var(--stroke);
      object-fit:cover;
      background: rgba(241,245,249,.9);
      flex:0 0 auto;
    }

    .iInfo{flex:1; min-width:0}

    .iName{
      font-weight:1000;
      font-size:13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .iMeta{
      font-size:11px;
      color:var(--muted);
      margin-top:3px;
      font-weight:900;
    }

    .status{font-weight:1000}
    .st-available{color:var(--ok)}
    .st-low{color:var(--warn)}
    .st-out{color:var(--bad)}
    .st-unknown{color:#334155}

    .qtyBox{
      display:flex;
      align-items:center;
      gap:6px;
    }

    .qBtn{
      width:42px;
      height:42px;
      border-radius:12px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.95);
      color:var(--text);
      cursor:pointer;
      font-weight:1000;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      touch-action: manipulation;
    }

    .qVal{
      min-width:48px;
      text-align:center;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.95);
      border-radius:12px;
      padding:8px 8px;
      font-weight:1000;
      font-size:14px;
    }

    .rmBtn{
      margin-top:6px;
      font-size:13px;
      color:#b91c1c;
      cursor:pointer;
      user-select:none;
      background:transparent;
      border:none;
      font-weight:1000;
      touch-action: manipulation;
      box-shadow:none;
      padding:0;
      flex:0 0 auto;
    }

    .btns{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    button{
      cursor:pointer;
      border-radius:16px;
      padding:12px 14px;
      font-weight:1000;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.95);
      color:var(--text);
      flex:1;
      transition: opacity .15s ease, transform .15s ease, box-shadow .15s ease;
      touch-action: manipulation;
      box-shadow: 0 10px 22px rgba(15,23,42,.06);
    }

    button:active{transform: translateY(1px)}

    button:disabled{
      opacity:.45;
      cursor:not-allowed;
      transform:none;
      filter:saturate(.85);
    }

    .primary{
      border-color: rgba(212,175,55,.65);
      background: linear-gradient(135deg, rgba(212,175,55,.28), rgba(184,134,11,.22));
      box-shadow: 0 12px 22px rgba(212,175,55,.14);
    }

    .success{
      margin-top:12px;
      padding:12px;
      border-radius:16px;
      border:1px solid rgba(22,163,74,.22);
      background:rgba(22,163,74,.08);
      color:#0f172a;
      font-weight:1000;
      line-height:1.7;
      display:none;
    }

    .empty{
      padding:14px;
      border:1px dashed var(--stroke);
      border-radius: var(--radius);
      color:var(--muted);
      text-align:center;
      background: rgba(255,255,255,.85);
    }

    .toast{
      position:fixed;
      bottom:16px;
      left:16px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--stroke);
      background:rgba(15,23,42,.88);
      color:#fff;
      z-index:999;
      display:none;
      font-weight:1000;
      max-width:min(92vw, 520px);
    }

    .actionBar{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      padding:10px 12px calc(10px + var(--safe-b));
      background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.96));
      border-top:1px solid var(--stroke);
      backdrop-filter: blur(12px);
      z-index:1000;
      display:none;
    }

    .actionBar .inner{
      max-width:var(--container-max);
      margin:0 auto;
      display:flex;
      gap:10px;
      align-items:stretch;
    }

    .actionBar .inner button{
      flex:1;
      padding:14px 14px;
      border-radius:18px;
    }

    @media (max-width:720px){
      body{ padding-bottom: calc(12px + var(--bar-h) + var(--safe-b)); }
      .actionBar{ display:block; }
      .btns{ display:none; }
    }

    :focus{
      outline:3px solid rgba(212,175,55,.25);
      outline-offset:3px;
    }

    .site-footer{
      margin-top:auto;
      padding:18px 16px 24px;
      text-align:center;
      color:var(--muted);
      border-top:1px solid var(--stroke);
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(10px);
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    .site-footer .line1{
      font-weight:1000;
      color:#0f172a;
    }

    .site-footer .line2{
      margin-top:6px;
      font-weight:900;
    }

    .footerQrWrap{
      margin-top:14px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
    }

    .footerQrLink{
      display:inline-flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      text-decoration:none;
      color:inherit;
    }

    .footerQrImage{
      width:92px;
      height:92px;
      object-fit:cover;
      border-radius:16px;
      border:1px solid rgba(212,175,55,.35);
      background:#fff;
      padding:6px;
      box-shadow: 0 10px 22px rgba(15,23,42,.08);
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }

    .footerQrLink:hover .footerQrImage{
      transform: translateY(-1px);
      border-color: rgba(212,175,55,.65);
      box-shadow: 0 14px 28px rgba(212,175,55,.14);
    }

    .footerQrText{
      font-size:12px;
      font-weight:1000;
      color:#475569;
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <img id="siteLogo" src="images/bslogo.webp" alt="BS Logo"
          onerror="this.onerror=null;this.style.display='none';this.parentElement.textContent='BS'">
      </div>
      <div>
        <div class="brand-title">B.S Medical &amp; Aesthetic</div>
        <div class="brand-sub">راجع السلة ثم أكمل الطلب</div>
      </div>
    </div>

    <div class="actions">
      <a class="back" href="./" aria-label="رجوع للكتالوج">
        <span class="backIcon">←</span>
        <span>رجوع للكتالوج</span>
      </a>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="card" aria-live="polite">
        <div style="font-weight:1000">محتويات السلة</div>

        <div class="invBar" aria-label="معلومات الطلب">
          <div>
            <div class="k">رقم الطلب</div>
            <div class="v" id="orderIdView">—</div>
          </div>
          <button class="copyBtn" id="copyOrderId" type="button" aria-label="نسخ رقم الطلب">📋 نسخ</button>
        </div>

        <div id="cartBox" class="items"></div>

        <div class="note" id="note" role="status"></div>

        <div style="margin-top:10px;font-weight:1000">نوع الطلب</div>
        <div class="seg">
          <label><input type="radio" name="type" value="قطاعي" checked> قطاعي</label>
          <label><input type="radio" name="type" value="جملة"> جملة</label>
        </div>
      </div>

      <div class="card">
        <div style="font-weight:1000;margin-bottom:8px">بيانات العميل</div>

        <div class="row2">
          <div>
            <label for="name">الاسم</label>
            <input id="name" placeholder="اكتب اسمك" autocomplete="name" />
            <div class="fieldError" id="err_name">⚠️ من فضلك اكتب الاسم</div>
          </div>

          <div>
            <label for="phone">رقم الموبايل</label>
            <input id="phone" placeholder="مثال: 01xxxxxxxxx أو +201xxxxxxxxx" inputmode="tel" autocomplete="tel" />
            <div class="fieldError" id="err_phone">⚠️ من فضلك اكتب رقم موبايل صحيح</div>
          </div>
        </div>

        <label for="address">العنوان</label>
        <textarea id="address" placeholder="المحافظة / المنطقة / تفاصيل" rows="2" autocomplete="street-address"></textarea>
        <div class="fieldError" id="err_address">⚠️ من فضلك اكتب العنوان</div>

        <div class="btns">
          <button class="primary" id="sendOrder">إتمام الطلب</button>
          <button id="clear" type="button">تفريغ السلة</button>
        </div>

        <div id="ok" class="success" role="status"></div>
      </div>
    </div>
  </main>

  <div class="actionBar" role="region" aria-label="إجراءات الطلب">
    <div class="inner">
      <button class="primary" id="sendOrderMobile" type="button">إتمام الطلب</button>
      <button id="clearMobile" type="button">تفريغ</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <div class="line1">Axentro – All Rights Reserved 2024 ©</div>
    <div class="line2">By Ahmed Hamouda</div>

    <div class="footerQrWrap">
      <a
        class="footerQrLink"
        href="https://axentro-official.github.io/axentro-website/links.html"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open links page"
      >
        <img
          class="footerQrImage"
          src="images/qr-links.png"
          alt="QR Links"
          onerror="this.onerror=null;this.src='qr-links.png'"
        >
        <span class="footerQrText">Scan me</span>
      </a>
    </div>
  </footer>

<script>
  const API_URL  = "https://script.google.com/macros/s/AKfycbwA-TDjlHKaqeTneXqCYxDQqJFht8uuk2J1wVEx8K6UVdgHGGmTQxXhlekxrmF3erO-/exec";
  const LS_KEY   = "AX_CART_V1";

  const THANKS_URL = "./thanks.html";

  const cartBox  = document.getElementById("cartBox");
  const note     = document.getElementById("note");
  const ok       = document.getElementById("ok");

  const sendBtnDesktop = document.getElementById("sendOrder");
  const sendBtnMobile  = document.getElementById("sendOrderMobile");
  const clearDesktop   = document.getElementById("clear");
  const clearMobile    = document.getElementById("clearMobile");

  const toastEl  = document.getElementById("toast");

  const orderIdView = document.getElementById("orderIdView");
  const copyOrderId = document.getElementById("copyOrderId");

  const nameEl    = document.getElementById("name");
  const phoneEl   = document.getElementById("phone");
  const addressEl = document.getElementById("address");

  const errName    = document.getElementById("err_name");
  const errPhone   = document.getElementById("err_phone");
  const errAddress = document.getElementById("err_address");

  const IMG_PLACEHOLDER = "https://via.placeholder.com/600x400?text=No+Image";

  function resolveImageById(id){
    return `images/${id}.webp`;
  }

  const PROD_CACHE_KEY = "AX_PRODUCTS_CACHE_V1";
  const PROD_CACHE_TS  = "AX_PRODUCTS_CACHE_TS_V1";
  const CACHE_TTL_MS   = 10 * 60 * 1000;

  let products = [];

  function escapeHtml(s){
    return String(s||"")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function escapeAttr(s){
    return String(s||"").replace(/"/g,"&quot;");
  }

  function statusClass(av){
    if(av === "Low stock") return "st-low";
    if(av === "Out of stock") return "st-out";
    if(av === "Available") return "st-available";
    return "st-unknown";
  }

  function getType(){
    return document.querySelector("input[name='type']:checked").value;
  }

  function setNote(){
    note.textContent =
      getType() === "جملة"
      ? "✅ تم استلام طلب الجملة بنجاح. بعد إتمام تسجيل البيانات سنحوّلك لصفحة التأكيد."
      : "✅ تم تجهيز طلبك. بعد إتمام تسجيل البيانات سنحوّلك لصفحة التأكيد.";
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.style.display = "block";
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.style.display="none", 2200);
  }

  function getCart(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }

  function setCart(items){
    localStorage.setItem(LS_KEY, JSON.stringify(items));
  }

  function ensureCartInitialized(){
    if(localStorage.getItem(LS_KEY) === null){
      setCart([]);
    }
  }

  function setQty(pid, qty){
    const cart = getCart();
    const idx = cart.findIndex(x=>String(x.id)===String(pid));
    if(idx < 0) return;

    const q = Math.max(0, Number(qty)||0);

    if(q === 0){
      cart.splice(idx, 1);
      setCart(cart);
      renderCart();
      showToast("تم حذف الصنف");
      return;
    }

    cart[idx].qty = q;
    setCart(cart);
    renderCart();
  }

  function removeItem(pid){
    setCart(getCart().filter(x=>String(x.id)!==String(pid)));
    renderCart();
    showToast("تم حذف الصنف");
  }

  function findProduct(pid){
    return products.find(x=>String(x.id)===String(pid)) || null;
  }

  function updateSendButtonsState(){
    const hasItems = getCart().length > 0;
    const disabled = !hasItems;

    if(sendBtnDesktop) sendBtnDesktop.disabled = disabled;
    if(sendBtnMobile) sendBtnMobile.disabled = disabled;
  }

  function renderCart(){
    const cart = getCart();
    cartBox.innerHTML = "";

    if(cart.length === 0){
      cartBox.innerHTML = `<div class="empty">السلة فارغة. ارجع للكتالوج وأضف منتجات.</div>`;
      updateSendButtonsState();
      return;
    }

    cart.forEach(it=>{
      const p = findProduct(it.id);

      const safe = p || {
        id: it.id,
        name: "منتج غير متاح (تم تحديث الكتالوج)",
        category: "—",
        availability: "Unknown"
      };

      const row = document.createElement("div");
      row.className = "item";

      row.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;flex:1;min-width:0">
          <img class="thumb" loading="lazy" decoding="async"
            src="${resolveImageById(escapeAttr(safe.id))}"
            onerror="this.onerror=null;this.src='${IMG_PLACEHOLDER}'"
            alt="${escapeHtml(safe.name)}">
          <div class="iInfo">
            <div class="iName">${escapeHtml(safe.name)}</div>
            <div class="iMeta">
              ${escapeHtml(safe.category)} •
              <span class="status ${statusClass(safe.availability)}">${escapeHtml(safe.availability)}</span> •
              ${escapeHtml(safe.id)}
            </div>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:12px;">
          <div class="qtyBox" aria-label="كمية المنتج">
            <button class="qBtn" data-act="minus" data-id="${escapeAttr(safe.id)}" aria-label="إنقاص">−</button>
            <div class="qVal" aria-live="polite">${Number(it.qty)||1}</div>
            <button class="qBtn" data-act="plus" data-id="${escapeAttr(safe.id)}" aria-label="زيادة">+</button>
          </div>
          <button class="rmBtn" data-act="rm" data-id="${escapeAttr(safe.id)}" aria-label="حذف من السلة">حذف</button>
        </div>
      `;

      cartBox.appendChild(row);
    });

    updateSendButtonsState();
  }

  cartBox.addEventListener("click", (ev)=>{
    const btn = ev.target.closest("[data-act]");
    if(!btn) return;

    const act = btn.getAttribute("data-act");
    const id  = btn.getAttribute("data-id");
    if(!id) return;

    if(act === "rm"){
      removeItem(id);
      return;
    }

    const cart = getCart();
    const it = cart.find(x=>String(x.id)===String(id));
    const current = Number(it?.qty)||0;

    if(act === "plus"){
      setQty(id, current + 1);
      return;
    }

    if(act === "minus"){
      setQty(id, Math.max(0, current - 1));
      return;
    }
  });

  cartBox.addEventListener("keydown", (ev)=>{
    const btn = ev.target.closest("[data-act]");
    if(!btn) return;
    if(ev.key !== "Enter" && ev.key !== " ") return;
    ev.preventDefault();
    btn.click();
  });

  function formatDateOnly(d){
    const dd = String(d.getDate()).padStart(2,"0");
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const yyyy = d.getFullYear();
    return `${dd}-${mm}-${yyyy}`;
  }

  function formatTimeOnly12(d){
    let h = d.getHours();
    const min = String(d.getMinutes()).padStart(2,"0");
    const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12;
    if(h === 0) h = 12;
    const hh = String(h).padStart(2,"0");
    return `${hh}:${min} ${ampm}`;
  }

  function generateOrderId(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    const rnd = Math.floor(100 + Math.random()*900);
    return `BS-${y}${m}${day}-${rnd}`;
  }

  function getStableOrderId(){
    let id = sessionStorage.getItem("BS_ORDER_ID");
    if(!id){
      id = generateOrderId();
      sessionStorage.setItem("BS_ORDER_ID", id);
    }
    return id;
  }

  function refreshOrderIdUI(){
    const id = getStableOrderId();
    orderIdView.textContent = id;
  }

  copyOrderId.addEventListener("click", async ()=>{
    const id = getStableOrderId();

    try{
      await navigator.clipboard.writeText(id);
      showToast("✅ تم نسخ رقم الطلب");
    }catch(e){
      const ta = document.createElement("textarea");
      ta.value = id;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast("✅ تم نسخ رقم الطلب");
    }
  });

  function clearFieldError(el, errEl){
    if(!el) return;
    el.classList.remove("invalid","shake");
    if(errEl) errEl.style.display = "none";
  }

  function setFieldError(el, errEl, msg){
    if(!el) return;

    el.classList.add("invalid","shake");
    setTimeout(()=> el.classList.remove("shake"), 320);

    if(errEl){
      errEl.textContent = msg || errEl.textContent;
      errEl.style.display = "block";
    }

    try{ el.focus({preventScroll:true}); }catch(e){ try{ el.focus(); }catch(_e){} }
    try{ el.scrollIntoView({behavior:"smooth", block:"center"}); }catch(e){}
  }

  ["input","change","blur"].forEach(evt=>{
    nameEl?.addEventListener(evt, ()=> clearFieldError(nameEl, errName));
    phoneEl?.addEventListener(evt, ()=> clearFieldError(phoneEl, errPhone));
    addressEl?.addEventListener(evt, ()=> clearFieldError(addressEl, errAddress));
  });

  function validateAndMark(){
    const cart = getCart();
    if(!cart.length) return { ok:false, msg:"السلة فارغة." };

    clearFieldError(nameEl, errName);
    clearFieldError(phoneEl, errPhone);
    clearFieldError(addressEl, errAddress);

    const name = (nameEl.value||"").trim();
    const phone = (phoneEl.value||"").trim();
    const address = (addressEl.value||"").trim();

    if(!name){
      setFieldError(nameEl, errName, "⚠️ من فضلك اكتب الاسم");
      return { ok:false, msg:"لازم تدخل الاسم." };
    }

    if(!phone){
      setFieldError(phoneEl, errPhone, "⚠️ من فضلك اكتب رقم الموبايل");
      return { ok:false, msg:"لازم تدخل رقم الموبايل." };
    }

    const p = phone.replace(/\s+/g,"");
    const okPhone = /^01\d{9}$/.test(p) || /^(\+?20)1\d{9}$/.test(p);

    if(!okPhone){
      setFieldError(phoneEl, errPhone, "⚠️ رقم الموبايل غير صحيح (مثال: 01xxxxxxxxx أو +201xxxxxxxxx)");
      return { ok:false, msg:"رقم الموبايل غير صحيح." };
    }

    if(!address){
      setFieldError(addressEl, errAddress, "⚠️ من فضلك اكتب العنوان");
      return { ok:false, msg:"لازم تدخل العنوان." };
    }

    const hasOut = cart.some(it=>{
      const pr = findProduct(it.id);
      return pr && pr.availability === "Out of stock";
    });

    if(hasOut){
      return { ok:false, msg:"فيه صنف غير متاح داخل السلة. احذفه أولاً." };
    }

    return { ok:true, msg:"" };
  }

  function buildOrderPayload(){
    const cart = getCart();
    const orderId = getStableOrderId();
    const type = getType();

    const name = (nameEl.value||"").trim();
    const phone = (phoneEl.value||"").trim();
    const address = (addressEl.value||"").trim();

    const now = new Date();
    const dateOnly = formatDateOnly(now);
    const timeOnly = formatTimeOnly12(now);

    const items = cart.map(it=>{
      const pr = findProduct(it.id);
      return {
        id: String(it.id),
        sku: String(it.id),
        name: pr?.name ? String(pr.name).trim() : "اسم المنتج",
        qty: Number(it.qty)||1,
        price: Number(pr?.price || 0)
      };
    });

    return {
      action: "createOrder",
      orderId,
      name,
      phone,
      address,
      orderType: type,
      createdDate: dateOnly,
      createdTime: timeOnly,
      items
    };
  }
  function saveProductsCache(list){
    localStorage.setItem(PROD_CACHE_KEY, JSON.stringify(list));
    localStorage.setItem(PROD_CACHE_TS, String(Date.now()));
  }

  function loadProductsFromCache(){
    try{
      const raw = localStorage.getItem(PROD_CACHE_KEY);
      const ts = Number(localStorage.getItem(PROD_CACHE_TS) || 0);
      if(!raw) return null;
      const list = JSON.parse(raw);
      if(!Array.isArray(list)) return null;
      return { list, ts };
    }catch(e){
      return null;
    }
  }

  async function fetchProductsFromApi(){
    const res = await fetch(API_URL, { cache: "no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  }

  async function hydrateProductsFast(){
    const cached = loadProductsFromCache();
    const now = Date.now();
    const hasCache = cached && cached.list && cached.list.length;

    if(hasCache){
      products = cached.list;
      renderCart();
    }else{
      products = [];
      renderCart();
      if(getCart().length){
        cartBox.insertAdjacentHTML(
          "afterbegin",
          `<div class="empty" style="margin-bottom:10px">جارٍ تحميل بيانات المنتجات...</div>`
        );
      }
    }

    const cacheFresh = hasCache && (now - cached.ts) < CACHE_TTL_MS;

    const doFetch = async ()=>{
      try{
        const freshList = await fetchProductsFromApi();
        products = freshList;
        saveProductsCache(freshList);
        renderCart();
      }catch(err){
        console.error(err);
        if(!hasCache && getCart().length){
          note.textContent = "⚠️ ملاحظة: لم يتم تحميل بيانات المنتجات من الشيت الآن. يمكنك إتمام الطلب، لكن بعض أسماء أو حالات الأصناف قد لا تكون محدثة.";
        }else{
          showToast("تعذر تحديث بيانات الكتالوج، يتم عرض النسخة المخزنة إن وُجدت.");
        }
      }
    };

    if(cacheFresh){
      setTimeout(doFetch, 400);
    }else{
      await doFetch();
    }
  }

  function clearCartAll(){
    setCart([]);
    renderCart();
    ok.style.display = "none";
    sessionStorage.removeItem("BS_ORDER_ID");
    refreshOrderIdUI();
    showToast("تم تفريغ السلة");
  }

  async function submitOrderToSystem(payload){
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8",
        "Accept": "application/json"
      },
      body: JSON.stringify(payload)
    });

    if(!res.ok){
      throw new Error("HTTP " + res.status);
    }

    const data = await res.json();
    if(!data || !data.ok){
      throw new Error(data?.error || "تعذر إتمام الطلب.");
    }

    return data;
  }

  async function sendOrderFlow(btnRef){
    const v = validateAndMark();
    if(!v.ok){
      showToast(v.msg);
      return;
    }

    const oldText = btnRef.textContent;
    btnRef.disabled = true;
    btnRef.textContent = "جارٍ إتمام الطلب...";

    if(sendBtnDesktop && sendBtnDesktop !== btnRef){
      sendBtnDesktop.disabled = true;
    }
    if(sendBtnMobile && sendBtnMobile !== btnRef){
      sendBtnMobile.disabled = true;
    }

    try{
      const payload = buildOrderPayload();
      const data = await submitOrderToSystem(payload);

      ok.style.display = "block";
      ok.textContent =
        getType() === "جملة"
          ? "✅ تم تسجيل طلب الجملة بنجاح، وسيتم تحويلك الآن لصفحة التأكيد."
          : "✅ تم تسجيل الطلب بنجاح، وسيتم تحويلك الآن لصفحة التأكيد.";

      try{
        sessionStorage.setItem("BS_LAST_ORDER_ID", String(data.order_id || payload.orderId || ""));
        sessionStorage.setItem("BS_LAST_CUSTOMER_NAME", String(payload.name || ""));
      }catch(e){}

      setCart([]);
      renderCart();
      sessionStorage.removeItem("BS_ORDER_ID");
      refreshOrderIdUI();

      setTimeout(()=>{
        window.location.href = THANKS_URL;
      }, 900);

    }catch(e){
      console.error(e);
      showToast("فشل إتمام الطلب: " + (e?.message || e));

      btnRef.disabled = false;
      btnRef.textContent = oldText;

      if(sendBtnDesktop) sendBtnDesktop.disabled = false;
      if(sendBtnMobile) sendBtnMobile.disabled = false;
    }
  }

  document.querySelectorAll("input[name='type']").forEach(r=>{
    r.addEventListener("change", setNote);
  });

  setNote();

  clearDesktop?.addEventListener("click", clearCartAll);
  clearMobile?.addEventListener("click", clearCartAll);

  sendBtnDesktop?.addEventListener("click", ()=> sendOrderFlow(sendBtnDesktop));
  sendBtnMobile?.addEventListener("click", ()=> sendOrderFlow(sendBtnMobile));

  ensureCartInitialized();
  refreshOrderIdUI();
  hydrateProductsFast();
  renderCart();
</script>
</body>
</html>
